name: FocusFlow

options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"

targets:
  FocusFlow:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FocusFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.focusflow
        PRODUCT_NAME: FocusFlow
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: FocusFlow
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  FocusFlowTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FocusFlowTests
    dependencies:
      - target: FocusFlow
    hostApplication: FocusFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.focusflow.tests
        PRODUCT_NAME: FocusFlowTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  FocusFlow:
    build:
      targets:
        FocusFlow: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FocusFlowTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
